services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: molarai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-molarai}
      POSTGRES_USER: ${POSTGRES_USER:-molarai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - molarai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  molarai-postgres-data:
