server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 0
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

molarai:
  appointment:
    time-zone: ${APPOINTMENT_TIME_ZONE}
  clinic:
    weekday-open: ${CLINIC_WEEKDAY_OPEN}
    weekday-close: ${CLINIC_WEEKDAY_CLOSE}
    saturday-open: ${CLINIC_SATURDAY_OPEN}
    saturday-close: ${CLINIC_SATURDAY_CLOSE}
    slot-minutes: ${CLINIC_SLOT_MINUTES}
    daily-slot-starts: ${CLINIC_DAILY_SLOT_STARTS}
    booking-horizon-days: ${CLINIC_BOOKING_HORIZON_DAYS}
    minimum-advance-minutes: ${CLINIC_MINIMUM_ADVANCE_MINUTES}
    providers: ${CLINIC_PROVIDERS}
    holidays: ${CLINIC_HOLIDAYS:}
  embedding:
    provider: ${EMBEDDING_PROVIDER}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL}
    dimension: ${EMBEDDING_DIMENSION}
    base-url: ${EMBEDDING_API_BASE_URL:https://api.openai.com/v1}
  ollama:
    embedding-base-url: ${OLLAMA_EMBEDDING_BASE_URL:}
    chat:
      base-url: ${OLLAMA_CHAT_BASE_URL}
      model: ${OLLAMA_CHAT_MODEL}
      api-key: ${OLLAMA_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  knowledge-base:
    path: ${KNOWLEDGE_BASE_PATH:/app/docs/knowledge-base}
  cancellation:
    enabled: ${CANCELLATION_ENABLED:false}
    otp:
      provider: ${CANCELLATION_OTP_PROVIDER}
      expose-code: false
